{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h5><i class="bi bi-person-plus"></i> Add New User</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" name="name" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Username *</label>
                <input type="text" name="username" class="form-control form-control-lg" required>
                <small class="text-muted">Used for login</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Password *</label>
                <input type="text" name="password" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Role *</label>
                <select name="role" class="form-select form-select-lg" required>
                    <option value="admin">Admin</option>
                    <option value="cashier" selected>Cashier</option>
                    <option value="staff">Staff</option>
                </select>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">Create User</button>
                <a href="{{ url_for('users') }}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
