{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h4><i class="bi bi-plus-circle"></i> Apply for Loan</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Member *</label>
                <select name="member_id" class="form-select" required>
                    <option value="">Select Member</option>
                    {% for member in members %}
                    <option value="{{ member.id }}">{{ member.name }} ({{ member.member_no }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Loan Amount (UGX) *</label>
                <input type="number" name="amount" class="form-control" step="0.01" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Interest Rate (%)</label>
                <input type="number" name="interest_rate" class="form-control" step="0.1" value="5.0">
            </div>
            <div class="mb-3">
                <label class="form-label">Repayment Period (Months) *</label>
                <input type="number" name="period_months" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Purpose</label>
                <textarea name="purpose" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Apply Loan</button>
            <a href="{{ url_for('loans') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
