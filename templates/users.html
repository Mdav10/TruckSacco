{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5><i class="bi bi-person-badge"></i> Users</h5>
    <a href="{{ url_for('add_user') }}" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-circle"></i> Add User
    </a>
</div>

<div class="row g-2">
    {% for user in users %}
    <div class="col-12">
        <div class="card shadow-sm">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-1">{{ user.name }}</h6>
                        <small class="text-muted">@{{ user.username }}</small>
                        <span class="badge {% if user.role == 'admin' %}bg-danger{% else %}bg-info{% endif %} ms-2">
                            {{ user.role }}
                        </span>
                    </div>
                    {% if user.id != current_user.id %}
                    <form method="POST" action="{{ url_for('delete_user', id=user.id) }}" onsubmit="return confirm('Delete this user?')">
                        <button type="submit" class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
