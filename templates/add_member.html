{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h5><i class="bi bi-person-plus"></i> Add New Member</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" name="name" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control form-control-lg">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control form-control-lg">
            </div>
            <div class="mb-3">
                <label class="form-label">Share Capital (UGX)</label>
                <input type="number" name="share_capital" class="form-control form-control-lg" step="0.01" value="0">
            </div>
            <div class="mb-3">
                <label class="form-label">Initial Savings (UGX)</label>
                <input type="number" name="savings" class="form-control form-control-lg" step="0.01" value="0">
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">Add Member</button>
                <a href="{{ url_for('members') }}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
