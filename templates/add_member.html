{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h4><i class="bi bi-person-plus"></i> Add New Member</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Full Name *</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Truck Number</label>
                    <input type="text" name="truck_no" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Share Capital</label>
                    <input type="number" name="share_capital" class="form-control" step="0.01" value="0">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Initial Savings</label>
                    <input type="number" name="savings" class="form-control" step="0.01" value="0">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Add Member</button>
            <a href="{{ url_for('members') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
