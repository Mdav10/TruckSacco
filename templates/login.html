{% extends "base.html" %}

{% block login_content %}
<div class="container-fluid vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
    <div class="card shadow-lg" style="width: 400px; border-radius: 20px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold">🚛 BUKUYA</h2>
                <p class="text-muted">Driver's SACCO Management</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <hr class="mt-4">
            <p class="text-center text-muted small">Default: manager / Manager@2026</p>
        </div>
    </div>
</div>
{% endblock %}
